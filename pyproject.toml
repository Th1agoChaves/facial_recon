[project]
name = "facial-recon"
version = "0.1.0"
description = "Sistema demonstrativo de reconhecimento facial com OpenCV e DeepFace"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "opencv-python>=4.9",
    "deepface>=0.0.93",
    "tf-keras>=2.21.0",
    "werkzeug>=3.1.9",
    "flask>=3.1.3",
    "flask-cors>=6.0.5",
    "gunicorn>=26.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
